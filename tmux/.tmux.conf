# Terminal compatibility
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",screen-256color:Tc"

# Enable mouse (scrolling, pane selection, resizing)
set -g mouse on

# Custom prefix
unbind C-b
set-option -g prefix C-\\
set-option -g repeat-time 0

# Window navigation
bind -n M-H previous-window
bind -n M-L next-window

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Open current directory in Finder
bind o run-shell "open #{pane_current_path}"

# Kill all other panes
bind -r e kill-pane -a

# Split panes in current path
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Vi mode for copy
set-window-option -g mode-keys vi

# ─── Bright Classic Status Bar ──────────────────────────────────────
set -g status-style "bg=yellow,fg=black"          # Default tmux green!
set -g status-left "#[bold] #S "
set -g status-justify left
set -g status-right-length 80
set -g status-right "#[fg=black] %H:%M #[fg=black] #(pmset -g batt 2>/dev/null | grep -o '[0-9]*%' | head -1) #[fg=black] #(uname -n) "

# Window list: bright on black when active
setw -g window-status-format "#[bg=yellow,fg=black] #I:#W "
setw -g window-status-current-format "#[bg=yellow,fg=black,bold] #I:#W* "
