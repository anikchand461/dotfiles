# ────────────────────────────────────────
# 🖥️ Terminal & Compatibility (Let nvim handle colors)
# ────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ────────────────────────────────────────
# 🖱️ Mouse Support
# ────────────────────────────────────────
set -g mouse on

# ────────────────────────────────────────
# 🔑 Custom Prefix (C-\)
# ────────────────────────────────────────
unbind C-b
set-option -g prefix C-\\
set-option -g repeat-time 0

# ────────────────────────────────────────
# 🪟 Window Navigation
# ────────────────────────────────────────
bind -n M-H previous-window
bind -n M-L next-window

# ────────────────────────────────────────
# ♻️ Reload Config
# ────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# ────────────────────────────────────────
# 📂 Open in Finder
# ────────────────────────────────────────
bind o run-shell "open #{pane_current_path}"

# ────────────────────────────────────────
# ✂️ Kill Other Panes
# ────────────────────────────────────────
bind -r e kill-pane -a

# ────────────────────────────────────────
# ➕ Split Panes in Current Path
# ────────────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# ────────────────────────────────────────
# 📝 Vi Mode for Copy
# ────────────────────────────────────────
set-window-option -g mode-keys vi

# ────────────────────────────────────────
# 🎨 SLEEK STATUS BAR (BOTTOM, DARK BG, NO BLOCKS)
# ────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=default,fg=#cdd6f4"  # Dark base

# Left: session name with icon (no block)
set -g status-left "#[fg=#b4befe,bold] #S "

# Right: date, time, battery, hostname (no blocks, just icons + text)
set -g status-right-length 110
set -g status-right " \
#[fg=#cba6f7] %d %b \
#[fg=#89dceb]󰥔 %H:%M \
#[fg=#a6e3a1]#( ~/.config/tmux/scripts/battery.sh ) \
#[fg=#f9e2af] #(uname -n)"

# Window list: minimal, no separators
setw -g window-status-separator ""
setw -g window-status-format " #[fg=#89b4fa]#I:#W "
setw -g window-status-current-format " #[fg=#89b4fa,bold]#I:#W "

# Optional: Add zoom indicator
setw -g window-status-current-format " #[fg=#89b4fa,bold]#I:#W#{?window_zoomed_flag, (),}"

# Borders
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#f5c2e7"

# ────────────────────────────────────────
# 🧩 TPM Plugins
# ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings
set -g @continuum-restore 'on'

# ────────────────────────────────────────
# 🚀 Initialize TPM
# ────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
